[project]
name = "multi-agent-ppt-backend"
version = "0.1.0"
description = "AI 驱动的多智能体 PPT 创作平台"
readme = "README.md"
authors = [
    { name = "Zhifan Zhang", email = "llypqxf@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "cryptography>=50.0.0",
    "databases>=0.9.0",
    "fastapi>=0.141.1",
    "httpx[socks]>=0.28.1",
    "langchain>=1.3.15",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-redis>=0.5.2",
    "matplotlib>=3.11.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "redis>=5.2.1,<8.0",
    "sqlalchemy>=2.0.51",
    "tavily-python>=0.8.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
multi-agent-ppt-backend = "multi_agent_ppt_backend:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
